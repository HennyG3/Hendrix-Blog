<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Capability and interface complexity in creative-specific software</title>
  <desc id="d">A straight line rising from super simple (low capability, low complexity) to super complex (high capability, high complexity).</desc>
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- light grid -->
  <g stroke="#e6e2da" stroke-width="1">
    <line x1="110" y1="330" x2="740" y2="330"/><line x1="110" y1="240" x2="740" y2="240"/><line x1="110" y1="150" x2="740" y2="150"/>
    <line x1="267.5" y1="60" x2="267.5" y2="420"/><line x1="425" y1="60" x2="425" y2="420"/><line x1="582.5" y1="60" x2="582.5" y2="420"/>
  </g>

  <!-- axes -->
  <g stroke="#0d1717" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="110" y1="420" x2="745" y2="420"/>
    <line x1="110" y1="420" x2="110" y2="55"/>
    <path d="M737 414 L746 420 L737 426"/>
    <path d="M104 63 L110 54 L116 63"/>
  </g>

  <!-- the proposal: a direct line -->
  <line x1="130" y1="402" x2="720" y2="78" stroke="#ff3c00" stroke-width="6" stroke-linecap="round"/>
  <circle cx="130" cy="402" r="9" fill="#0d1717"/>
  <circle cx="720" cy="78" r="9" fill="#0d1717"/>

  <g font-size="16">
    <text x="152" y="410"><tspan font-weight="600" fill="#0d1717">Super simple</tspan><tspan fill="#565c5b">: few features, nothing to learn</tspan></text>
    <text x="700" y="62" text-anchor="end"><tspan font-weight="600" fill="#0d1717">Super complex</tspan><tspan fill="#565c5b">: every feature, a lot to learn</tspan></text>
  </g>

  <!-- axis ends -->
  <g fill="#565c5b" font-size="13">
    <text x="110" y="442" text-anchor="middle">Low</text>
    <text x="740" y="442" text-anchor="end">High</text>
    <text x="98" y="424" text-anchor="end">Low</text>
    <text x="98" y="68" text-anchor="end">High</text>
  </g>

  <!-- axis titles -->
  <g fill="#0d1717" font-size="15" font-weight="600">
    <text x="425" y="476" text-anchor="middle">Capability (what the software can do)</text>
    <text transform="translate(44 240) rotate(-90)" text-anchor="middle">Interface complexity (what the user has to learn)</text>
  </g>
</svg>
